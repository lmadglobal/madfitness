<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness</title>
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fitness">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F3F4F1; --card:#FFFFFF; --ink:#16181A; --muted:#5B6168; --line:#ECEEE9; --border:#DADDD6;
  --track:#E6E9E3; --accent:#1F6B4F; --accent-soft:#EAF3EE; --on-accent:#FFFFFF;
  --protein:#1D4ED8; --carbs:#F59E0B; --fat:#6B4E9B; --water:#0E7490; --water-soft:#DCEEF2;
  --danger:#B42318; --chip:#F0F1EE; --over:#C2410C; --cheat:#C2410C; --cheat-soft:#FDE7D7; --cheat-ink:#9A3412;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111312; --card:#1C1F1D; --ink:#F1F3EF; --muted:#A3AAA4; --line:#2A2E2B; --border:#363B37;
    --track:#2D322E; --accent:#4FB58A; --accent-soft:#1D3328; --on-accent:#0B1510;
    --protein:#6E95F5; --carbs:#F7B53B; --fat:#A98BD6; --water:#3DB4CF; --water-soft:#1E3940;
    --danger:#F47766; --chip:#262A27; --over:#F08A4B; --cheat:#F08A4B; --cheat-soft:#4A2A17; --cheat-ink:#FFC9A3;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh;padding-top:env(safe-area-inset-top)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
body.has-tabs .wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 12px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:20px;font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
.icon-btn.plain{border:0;background:transparent}
.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 4px;margin-bottom:14px}
.datebar .lbl{font-size:15px;font-weight:600;background:none;border:0;min-height:44px}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ring-row{display:flex;align-items:center;gap:20px}
.big{font-size:22px;font-weight:700}
.big small{font-size:14px;font-weight:500;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.bar-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar-top b{font-weight:600}.bar-top span{color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.fill{height:8px;border-radius:4px}
.water{border-top:1px solid var(--line);margin-top:16px;padding-top:16px;display:flex;align-items:center;gap:10px}
.cups{display:grid;gap:4px;flex:1}
.cup{height:26px;border-radius:6px;border:0;background:var(--water-soft);padding:0}
.cup.on{background:var(--water)}
.round{width:44px;height:44px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.search-btn{width:100%;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;color:var(--muted);font-size:16px;text-align:left}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.btn{height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);height:52px;font-size:16px;font-weight:700;width:100%;border-radius:14px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;min-height:44px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--border);background:var(--card);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:10px}
.meal-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.meal-hd b{font-size:16px}.meal-hd span{font-size:14px;font-weight:600;color:var(--muted)}
.row{width:100%;border:0;background:transparent;text-align:left;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.row .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .n{font-size:15px;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .s.acc{color:var(--accent);font-weight:600}
.row .k{font-size:15px;white-space:nowrap}
.addrow{display:flex;align-items:center;min-height:48px;padding:0 16px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;font-size:15px;font-weight:600;color:var(--accent)}
details.card{padding:0 16px}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:52px;font-size:16px;font-weight:700;cursor:pointer}
summary::-webkit-details-marker{display:none}
details[open] summary svg{transform:rotate(180deg)}
.nrow{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.nrow span:last-child{color:var(--muted)}
/* Screens & sheets */
.screen{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;padding-top:env(safe-area-inset-top)}
.screen-hd{position:sticky;top:0;background:var(--bg);z-index:2;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.screen-hd .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.screen-hd .top>div{display:flex;align-items:center;gap:4px}
.screen-hd h1{font-size:22px}
.field{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px}
.field input{flex:1;border:0;outline:none;font-size:16px;background:transparent;min-width:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;overscroll-behavior:none;will-change:transform}
.scrim{transition:background .2s}
.item-edit{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border:0;background:transparent;text-align:left;padding:6px 0;min-height:48px}
.item-edit .s{font-size:13px;color:var(--muted)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:4px auto 12px}
.sec{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.sublabel{font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;overflow-x:auto}
.seg button{flex:1 0 auto;min-height:40px;border:0;border-radius:9px;background:transparent;font-size:14px;padding:0 12px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pills button{height:40px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:13px;padding:0}
.pills button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:12px}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:22px;padding:0}
.stepper input{width:64px;text-align:center;border:0;background:transparent;font-size:17px;font-weight:700;outline:none}
.label-box{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.label-cal{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:6px solid var(--ink)}
.label-cal b{font-size:18px;font-weight:800}.label-cal span{font-size:28px;font-weight:800}
.macro3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.macro3 div{display:flex;flex-direction:column;gap:2px}
.macro3 span{font-size:12px;color:var(--muted)}.macro3 b{font-size:16px}
.lrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.lrow:last-child{border-bottom:0}.lrow b{font-weight:600}
.results{background:var(--card);border-radius:16px;overflow:hidden;margin:0 16px 16px}
.msg{padding:24px 16px;text-align:center;color:var(--muted);font-size:15px;line-height:1.45}
.inp{height:48px;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:0 12px;font-size:16px;width:100%;outline:none}
.inp:focus{border-color:var(--ink)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-grid label,.sec label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.check{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.saved{background:var(--card);border-radius:16px;margin:0 16px 12px;overflow:hidden}
.saved.open{box-shadow:0 0 0 2px var(--accent)}
.saved-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.mac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mac div{border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--chip)}
.mac span{font-size:12px;color:var(--muted)}.mac b{font-size:15px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:6px 0;font-size:15px}
.item .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.item .s{font-size:13px;color:var(--muted)}
.empty-box{border:1.5px dashed var(--border);border-radius:16px;padding:16px;margin:0 16px 12px;color:var(--muted);font-size:14px;line-height:1.45}
.datebar .lbl{display:flex;align-items:center;gap:6px}
.cal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin:-6px 0 14px}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-hd b{font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-dow{font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-day{position:relative;height:42px;border:0;background:transparent;border-radius:21px;font-size:15px;padding:0;display:flex;align-items:center;justify-content:center}
.cal-day:disabled{color:var(--muted);opacity:.4;cursor:default}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal-day.cheat{background:var(--cheat-soft);color:var(--cheat-ink);font-weight:700}
.cal-day.sel{background:var(--ink);color:var(--bg);font-weight:700}
.cal-day.sel.cheat{box-shadow:inset 0 0 0 3px var(--cheat)}
.cal-day .dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:3px;background:var(--accent)}
.cal-day.sel .dot{background:var(--bg)}
.cal-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;padding:0 4px}
.cal-legend span{display:flex;align-items:center;gap:6px}
.cheatrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:16px;padding:6px 16px;margin-bottom:14px;min-height:56px}
.cheatrow label{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;min-height:44px;cursor:pointer}
.cheatrow input{width:22px;height:22px;accent-color:var(--cheat)}
.cheatrow .note{text-align:right}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;background:var(--cheat-soft);color:var(--cheat-ink);font-size:12px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;pointer-events:none}
.tabs>*{pointer-events:auto}
.tabnav{background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tabnav button{min-height:50px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
.tabnav button[aria-current=page]{color:var(--accent);font-weight:700}
.resume{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);padding:0 16px;margin-bottom:14px;font-size:15px;text-align:left}
.tabs .resume{width:auto;margin:0 12px 8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.resume>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .rt{font-variant-numeric:tabular-nums;opacity:.8}
.resume .rgo{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rcard{background:var(--card);border:0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:112px;text-align:left}
.rcard.dashed{border:1.5px dashed var(--border);background:transparent;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted)}
.rcard .rn{font-size:16px;font-weight:700}
.rcard .rs{font-size:13px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .rl{margin-top:auto;font-size:12px;font-weight:600;color:var(--muted)}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat3>div{display:flex;flex-direction:column;gap:2px}.stat3 b{font-size:21px}
.weekdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.weekdots div{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.weekdots i{font-style:normal;width:32px;height:32px;border-radius:16px;background:var(--track);color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center}
.weekdots i.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.weekdots i.future{background:transparent;opacity:.6}
.weekdots i.today{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.hcard{width:100%;background:var(--card);border:0;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:10px}
.hcard .hrow{display:flex;justify-content:space-between;gap:8px;width:100%}
.hcard .hrow b{font-size:16px}.hcard .hrow span{font-size:13px;color:var(--muted);white-space:nowrap}
.hcard .hs{font-size:13px;color:var(--muted);line-height:1.5}
.pr-badge{align-self:flex-start;height:24px;padding:0 10px;border-radius:12px;background:var(--cheat-soft);color:var(--cheat-ink);font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.prt{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;background:var(--cheat-soft);color:var(--cheat-ink);font-size:11px;font-weight:800;vertical-align:middle}
.wcard{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.wc-hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wc-hd>div:first-child{display:flex;flex-direction:column;gap:2px}
.wc-hd b{font-size:18px}
.kicker{font-size:12px;font-weight:700;color:var(--water);text-transform:uppercase;letter-spacing:.06em}
.done-pill{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--muted)}
.done-pill.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.c3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.c3 label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.cin,.sin{height:44px;border:1px solid var(--border);border-radius:10px;text-align:center;font-size:17px;font-weight:700;background:var(--card);width:100%;outline:none;min-width:0}
.cin:focus,.sin:focus{border:1.5px solid var(--ink)}
.cin::placeholder,.sin::placeholder{color:var(--muted);font-weight:500;opacity:.7}
.sethd,.setrow{display:grid;grid-template-columns:28px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.sethd{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sethd span:nth-child(3),.sethd span:nth-child(4){text-align:center}
.setrow{border-radius:10px;padding:3px 0}
.setrow.done{background:var(--accent-soft);margin:0 -8px;padding:3px 8px}
.setrow.done .sin{background:transparent;border-color:transparent}
.setrow .sn{font-weight:700}.setrow .sp{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwrap{position:relative}.rwrap .prt{position:absolute;top:-7px;right:-6px}
.chk{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--chip);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.exname{border:0;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px;min-height:44px;justify-content:center}
.exname b{font-size:18px}.exname span{font-size:13px;color:var(--muted)}
.wtitle{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;flex:1;min-width:0}
.wtitle b{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtitle span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.restbar{background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px}
.restbar[hidden]{display:none}
.restbar button{height:40px;min-width:52px;border-radius:10px;border:0;background:rgba(127,127,127,.3);color:inherit;font-size:14px;font-weight:600}
.rtrack{height:6px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}
.rtrack div{height:6px;border-radius:3px;background:#4FB58A}
.btn.soft{background:var(--chip);border-color:transparent}
.mini{width:32px;height:22px;border:0;background:transparent;color:var(--muted);font-size:11px;padding:0}
.mini:disabled{opacity:.25}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.sheet .stat{background:var(--chip)}
.stat span{font-size:12px;font-weight:600;color:var(--muted)}.stat b{font-size:21px;font-weight:800}
.stat small{font-size:13px;font-weight:500;color:var(--muted)}
.pr-box{background:var(--cheat-soft);color:var(--cheat-ink);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.6}
.swipe-card{padding:0;overflow:hidden}
.pager{display:flex;align-items:flex-start;transition:height .25s ease;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding:20px 20px 8px}
.pdots{display:flex;justify-content:center;gap:6px;padding:4px 0 14px}
.pdots button{border:0;background:transparent;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:16px;font-size:12px;font-weight:600;color:var(--muted)}
.pdots button i{width:7px;height:7px;border-radius:4px;background:var(--border)}
.pdots button[aria-current=true]{color:var(--ink);background:var(--chip)}
.pdots button[aria-current=true] i{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;text-align:center}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script src="workouts.js"></script>
<script>
'use strict';
/* ---------- Icons ---------- */
const I = {
  gear:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  left:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  plus:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  search:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  bookmark:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
  bolt:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>',
  chev:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  x:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  book:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg>',
  play:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  cal:'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  check:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  dots:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  leaf:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4 3-6 6-6 10a6 6 0 0 0 12 0c0-4-2-7-6-10z"/><path d="M12 9v9"/></svg>',
  dumbbell:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>'
};

/* ---------- Constants ---------- */
const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];
const NUTS = ['kcal','protein','carbs','fat','fiber','sugar','sodium','satfat','chol','potassium'];
const NUT_INFO = {
  fiber:['Fiber','g'], sugar:['Sugar','g'], sodium:['Sodium','mg'], satfat:['Saturated fat','g'],
  chol:['Cholesterol','mg'], potassium:['Potassium','mg']
};
// USDA FoodData Central nutrient ids → our keys (values are per 100 g / 100 ml)
const FDC_IDS = {1003:'protein',1004:'fat',1005:'carbs',1079:'fiber',2000:'sugar',1093:'sodium',1258:'satfat',1253:'chol',1092:'potassium'};
const DEFAULT_GOALS = {kcal:2200, protein:150, carbs:220, fat:70, water:8, fiber:30, sodium:2300};
const STORE_KEY = 'fittrack.v1';

/* ---------- Storage ---------- */
function blankData(){ return {days:{}, saved:[], recents:[], goals:{...DEFAULT_GOALS}, settings:{apiKey:'', rest:90},
  workouts:[], routines:[], customEx:[], bests:{}, lastSets:{}, lastCardio:{}, active:null}; }
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return blankData();
    const d = JSON.parse(raw);
    const b = blankData();
    return {...b, ...d, goals:{...b.goals, ...(d.goals||{})}, settings:{...b.settings, ...(d.settings||{})}};
  }catch(e){ return blankData(); }
}
let data = loadData();
// The log covers the current year only: on the first open of a new year, earlier days are cleared.
// Saved meals, recent foods and goals carry over.
function pruneOldYears(){
  const y = String(new Date().getFullYear()) + '-';
  let removed = 0;
  for(const k of Object.keys(data.days)) if(!k.startsWith(y)){ delete data.days[k]; removed++; }
  // Workout history follows the same rule; personal records, last-used numbers and routines carry over.
  const before = data.workouts.length;
  data.workouts = data.workouts.filter(w => w.date.startsWith(y));
  removed += before - data.workouts.length;
  if(removed) save();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch(e){ toast('Could not save — storage full?'); }
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

/* ---------- Helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0 = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;
const fmt = n => r0(n).toLocaleString('en-US');
const fmtQty = n => { const v = Math.round(n * 100) / 100; return String(v); };
function keyOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dateFromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function day(k){ if(!data.days[k]) data.days[k] = {entries:[], water:0}; return data.days[k]; }
function scale(n, f){ const o = {}; for(const k of NUTS) o[k] = (n && n[k] != null) ? n[k] * f : 0; return o; }
function add(a, b){ const o = {}; for(const k of NUTS) o[k] = (a[k]||0) + (b[k]||0); return o; }
function zero(){ return scale({}, 0); }
function entryTotals(e){ return scale(e.per, e.qty); }
function dayTotals(k){ return (data.days[k]?.entries || []).reduce((t, e) => add(t, entryTotals(e)), zero()); }
function defaultMeal(){ const h = new Date().getHours() + new Date().getMinutes()/60; return h < 11 ? 'Breakfast' : h < 16 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snacks'; }
function niceName(s){
  s = String(s || '').trim();
  if(s && s === s.toUpperCase() && /[A-Z]/.test(s)){
    s = s.toLowerCase().replace(/(^|[\s\-\/(,&])([a-z])/g, (m, p, c) => p + c.toUpperCase());
  }
  return s;
}

/* ---------- App state (not persisted) ---------- */
const ui = {
  date: keyOf(new Date()),
  screen: null,        // 'search' | 'saved' | 'settings'
  sheet: null,         // {type:..., ...}
  search: {q:'', results:[], status:'idle', error:''},
  openSaved: null,
  detailsOpen: false,
  tab: 'diet',
  wstack: []
};

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2200);
}

/* ---------- Main Diet page ---------- */
function ring(eaten, goal){
  const r = 52, c = 2 * Math.PI * r;
  const frac = goal > 0 ? Math.min(eaten / goal, 1) : 0;
  const over = eaten > goal;
  const left = goal - eaten;
  return `<svg role="img" aria-label="${fmt(eaten)} of ${fmt(goal)} calories eaten" width="128" height="128" viewBox="0 0 128 128" style="flex:none">
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--track)" stroke-width="12"/>
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="${over ? 'var(--over)' : 'var(--accent)'}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${(frac * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 64 64)"/>
    <text x="64" y="62" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)">${fmt(Math.abs(left))}</text>
    <text x="64" y="82" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">${over ? 'kcal over' : 'kcal left'}</text>
  </svg>`;
}
function bar(name, val, goal, color){
  const pct = goal > 0 ? Math.min(val / goal * 100, 100) : 0;
  return `<div><div class="bar-top"><b>${name}</b><span>${r0(val)} / ${r0(goal)} g</span></div>
    <div class="track"><div class="fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div></div>`;
}
function renderMain(){
  if(ui.tab === 'workouts') renderWorkouts(); else renderDiet();
  renderTabs();
}
function renderTabs(){
  let el = document.getElementById('tabs');
  if(!el){ el = document.createElement('div'); el.id = 'tabs'; el.className = 'tabs'; document.body.appendChild(el); }
  document.body.classList.add('has-tabs');
  const a = data.active;
  el.innerHTML = (a && ui.tab !== 'workouts' ? `<button class="resume" data-act="w-resume"><span><b>${esc(a.name)}</b> in progress</span><span class="rt" id="resume-time">${clock(Date.now() - a.start)}</span><span class="rgo">Resume</span></button>` : '') +
    `<nav class="tabnav" aria-label="App sections">
      <button data-act="tab" data-tab="diet" ${ui.tab === 'diet' ? 'aria-current="page"' : ''}>${I.leaf}Diet</button>
      <button data-act="tab" data-tab="workouts" ${ui.tab === 'workouts' ? 'aria-current="page"' : ''}>${I.dumbbell}Workouts</button>
    </nav>`;
}
function renderDiet(){
  const g = data.goals, k = ui.date, d = data.days[k] || {entries:[], water:0}, t = dayTotals(k);
  const today = keyOf(new Date());
  const dt = dateFromKey(k);
  const label = (k === today ? 'Today · ' : k === keyOf(new Date(Date.now() - 864e5)) ? 'Yesterday · ' : '') +
    dt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  const cupsN = Math.max(g.water || 8, d.water);
  let cups = '';
  for(let i = 0; i < cupsN; i++) cups += `<button class="cup ${i < d.water ? 'on' : ''}" data-act="cup" data-i="${i}" aria-label="Set water to ${i+1} cups"></button>`;

  const recents = data.recents.slice(0, 8).map((f, i) =>
    `<button class="chip" data-act="recent" data-i="${i}">+ ${esc(f.name)}</button>`).join('');

  const meals = MEALS.map(m => {
    const es = d.entries.filter(e => e.meal === m);
    const sub = es.reduce((s, e) => s + entryTotals(e).kcal, 0);
    const rows = es.map(e => `<button class="row" data-act="entry" data-id="${e.id}">
        <span class="t"><span class="n">${esc(e.name)}</span>
        <span class="s ${e.items ? 'acc' : ''}">${e.items ? `Saved meal · ${e.items.length} item${e.items.length === 1 ? '' : 's'}${e.qty !== 1 ? ' × ' + fmtQty(e.qty) : ''}` : esc(servingText(e))}</span></span>
        <span class="k">${fmt(entryTotals(e).kcal)}</span></button>`).join('');
    return `<div class="meal"><div class="meal-hd"><b>${m}</b><span>${fmt(sub)} kcal</span></div>${rows}
      <button class="addrow" data-act="add-to" data-meal="${m}">+ Add to ${m.toLowerCase()}</button></div>`;
  }).join('');

  const nrows = Object.entries(NUT_INFO).map(([key, [n, u]]) => {
    const goal = key === 'fiber' ? g.fiber : key === 'sodium' ? g.sodium : null;
    return `<div class="nrow"><span>${n}</span><span>${fmt(t[key])}${goal ? ' / ' + fmt(goal) : ''} ${u}</span></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = `<div class="wrap">
    <div class="hdr"><h1>Diet</h1><button class="icon-btn" data-act="settings" aria-label="Settings">${I.gear}</button></div>
    <div class="datebar">
      <button class="icon-btn plain" data-act="prev" aria-label="Previous day" ${k.slice(5) === '01-01' ? 'disabled style="opacity:.35"' : ''}>${I.left}</button>
      <button class="lbl" data-act="cal" aria-expanded="${!!ui.calOpen}">${label}${d.cheat ? ' <span class="badge">Cheat</span>' : ''}<span style="display:flex;color:var(--muted);transform:${ui.calOpen ? 'rotate(180deg)' : 'none'}">${I.chev}</span></button>
      <button class="icon-btn plain" data-act="next" aria-label="Next day" ${k === today ? 'disabled style="opacity:.35"' : ''}>${I.right}</button>
    </div>
    ${ui.calOpen ? calendarHTML() : ''}
    <div class="cheatrow">
      <label><input type="checkbox" id="cheat" ${d.cheat ? 'checked' : ''}> Cheat day</label>
      <span class="note">${lastCheatText()}</span>
    </div>
    <section class="card swipe-card" aria-label="Daily summary and goals">
     <div class="pager" id="pager">
     <div class="pane" aria-label="Today">
      <div class="ring-row">${ring(t.kcal, g.kcal)}
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><div class="label">Eaten</div><div class="big">${fmt(t.kcal)} <small>kcal</small></div></div>
          <div><div class="label">Goal</div><div class="big">${fmt(g.kcal)} <small>kcal</small></div></div>
        </div></div>
      <div class="bars">${bar('Protein', t.protein, g.protein, 'var(--protein)')}${bar('Carbs', t.carbs, g.carbs, 'var(--carbs)')}${bar('Fat', t.fat, g.fat, 'var(--fat)')}</div>
      <div class="water">
        <button class="round" style="background:var(--chip);color:var(--ink)" data-act="water-" aria-label="Remove a cup of water">${I.minus}</button>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px">
          <div class="bar-top" style="margin:0"><b>Water</b><span>${d.water} / ${g.water} cups</span></div>
          <div class="cups" style="grid-template-columns:repeat(${cupsN},minmax(0,1fr))">${cups}</div>
        </div>
        <button class="round" style="background:var(--water);color:#fff" data-act="water+" aria-label="Add a cup of water">${I.plus}</button>
      </div>
     </div>
     <div class="pane" aria-label="Daily goals">${goalsPane()}</div>
     </div>
     <div class="pdots" role="group" aria-label="Card view">
       <button data-act="pane" data-i="0" aria-current="${!ui.pane}"><i></i>Today</button>
       <button data-act="pane" data-i="1" aria-current="${ui.pane === 1}"><i></i>Goals</button>
     </div>
    </section>
    <button class="search-btn" data-act="search"><span style="color:var(--ink);display:flex">${I.search}</span>Search foods — e.g. “Kiwi Snapple”</button>
    <div class="grid2">
      <button class="btn dark" data-act="saved">${I.bookmark} Saved meals</button>
      <button class="btn" data-act="quick">${I.bolt} Quick add</button>
    </div>
    ${recents ? `<div class="label">Recent</div><div class="chips">${recents}</div>` : ''}
    <h2 style="margin:10px 0">${k === today ? 'Today’s log' : 'Log'}</h2>
    ${meals}
    <details class="card" ${ui.detailsOpen ? 'open' : ''} data-details>
      <summary>Full nutrition <span style="color:var(--muted);display:flex">${I.chev}</span></summary>
      <div style="padding-bottom:8px">${nrows}</div>
    </details>
  </div>`;
  bindPager();
  document.getElementById('cheat').addEventListener('change', ev => {
    const dd = day(ui.date); dd.cheat = ev.target.checked; if(!dd.cheat) delete dd.cheat; save(); renderMain();
  });
  const det = document.querySelector('[data-details]');
  det.addEventListener('toggle', () => { ui.detailsOpen = det.open; });
}
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function calendarHTML(){
  const now = new Date(), Y = now.getFullYear(), m = ui.calMonth ?? now.getMonth(), todayK = keyOf(now);
  const start = new Date(Y, m, 1).getDay(), dim = new Date(Y, m + 1, 0).getDate();
  let cells = ['S','M','T','W','T','F','S'].map(x => `<div class="cal-dow" aria-hidden="true">${x}</div>`).join('');
  for(let i = 0; i < start; i++) cells += '<div></div>';
  for(let dnum = 1; dnum <= dim; dnum++){
    const k = keyOf(new Date(Y, m, dnum)), dd = data.days[k];
    const has = dd && (dd.entries.length || dd.water);
    const cls = ['cal-day', k === ui.date ? 'sel' : '', k === todayK ? 'today' : '', dd && dd.cheat ? 'cheat' : ''].join(' ');
    const lbl = new Date(Y, m, dnum).toLocaleDateString('en-US', {month:'long', day:'numeric'}) + (dd && dd.cheat ? ', cheat day' : '') + (has ? ', has entries' : '');
    cells += `<button class="${cls}" data-act="pick-day" data-k="${k}" aria-label="${lbl}" ${k > todayK ? 'disabled' : ''}>${dnum}${has ? '<span class="dot"></span>' : ''}</button>`;
  }
  const dec = now.getMonth() === 11 ? `<div class="note" style="padding:8px 4px 0">The log starts fresh on January 1. Export a backup in Settings if you want to keep this year.</div>` : '';
  return `<div class="cal" role="group" aria-label="Pick a day">
    <div class="cal-hd">
      <button class="icon-btn plain" data-act="cal-prev" aria-label="Previous month" ${m === 0 ? 'disabled style="opacity:.3"' : ''}>${I.left}</button>
      <b>${MONTHS[m]} ${Y}</b>
      <button class="icon-btn plain" data-act="cal-next" aria-label="Next month" ${m === 11 ? 'disabled style="opacity:.3"' : ''}>${I.right}</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span><span style="width:6px;height:6px;border-radius:3px;background:var(--accent)"></span>Logged</span>
      <span><span style="width:14px;height:14px;border-radius:7px;background:var(--cheat-soft);box-shadow:inset 0 0 0 1px var(--cheat)"></span>Cheat day</span>
      <button class="link" style="min-height:0;margin-left:auto" data-act="today">Go to today</button></div>
    ${dec}
  </div>`;
}
function lastCheatText(){
  const todayK = keyOf(new Date());
  // Show the most recent cheat day before the day being viewed (so checking today still shows your previous one).
  const ks = Object.keys(data.days).filter(k => data.days[k].cheat && k < ui.date && k <= todayK).sort();
  if(!ks.length) return 'No earlier cheat days';
  const last = ks[ks.length - 1];
  const diff = Math.round((dateFromKey(ui.date) - dateFromKey(last)) / 864e5);
  const when = diff === 1 ? '1 day before' : diff + ' days before';
  return `Previous: ${dateFromKey(last).toLocaleDateString('en-US', {month:'short', day:'numeric'})} · ${when}`;
}
function servingText(e){
  if(e.qty === 1) return e.servingLabel || '1 serving';
  if(e.servingUnitMode) return fmtQty(e.qty) + ' ' + (e.servingUnit || e.servingLabel);

/* ---------- USDA search ---------- */
function apiKey(){ return (data.settings.apiKey || '').trim() || 'DEMO_KEY'; }
function normalizeFood(f){
  const per = {};
  let kcal = null, kj = null, atw = null;
  for(const n of (f.foodNutrients || [])){
    const id = n.nutrientId ?? n.nutrient?.id;
    const v = n.value ?? n.amount;
    if(v == null) continue;
    if(id === 1008) kcal = v;
    else if(id === 2048 || id === 2047){ if(atw == null || id === 2048) atw = v; }
    else if(id === 1062) kj = v;
    else if(FDC_IDS[id]) per[FDC_IDS[id]] = v;
  }
  per.kcal = kcal ?? atw ?? (kj != null ? kj / 4.184 : null);
  if(per.kcal == null && (per.protein != null || per.carbs != null || per.fat != null)){
    per.kcal = (per.protein||0) * 4 + (per.carbs||0) * 4 + (per.fat||0) * 9;
  }
  const liquid = /^(ml|mlt)$/i.test(f.servingSizeUnit || '');
  const unit = liquid ? 'ml' : 'g';
  const servings = [];
  if(f.servingSize && /^(g|grm|ml|mlt)$/i.test(f.servingSizeUnit || '')){
    const hh = (f.householdServingFullText || '').trim();
    const size = r1(f.servingSize);
    servings.push({label: hh ? `${hh} (${size} ${unit})` : `${size} ${unit}`, factor: f.servingSize / 100});
  }
  for(const m of (f.foodMeasures || [])){
    if(!m.gramWeight || !m.disseminationText || /quantity not specified/i.test(m.disseminationText)) continue;
    if(servings.length >= 5) break;
    servings.push({label: `${m.disseminationText} (${r1(m.gramWeight)} g)`, factor: m.gramWeight / 100});
  }
  servings.push({label: `100 ${unit}`, factor: 1});
  servings.push({label: 'Custom ' + unit, unit, factor: 0.01, unitMode: true});
  return {
    fdcId: f.fdcId, source: 'usda',
    name: niceName(f.description),
    brand: niceName(f.brandName || f.brandOwner || ''),
    kind: f.dataType === 'Branded' ? 'Branded' : 'Generic',
    base: per, servings
  };
}
let searchSeq = 0;
async function runSearch(q){
  q = q.trim();
  ui.search.q = q;
  if(!q){ ui.search = {q:'', results:[], status:'idle', error:''}; renderResults(); return; }
  const seq = ++searchSeq;
  ui.search.status = 'loading'; renderResults();
  try{
    const url = 'https://api.nal.usda.gov/fdc/v1/foods/search?api_key=' + encodeURIComponent(apiKey()) +
      '&pageSize=25&query=' + encodeURIComponent(q);
    const res = await fetch(url);
    if(seq !== searchSeq) return;
    if(!res.ok){
      ui.search.status = 'error';
      ui.search.error = res.status === 429 ? 'Hit the search limit for the shared demo key. Add your own free USDA key in Settings (gear icon).'
        : res.status === 403 ? 'The USDA API key was rejected. Check it in Settings.'
        : 'Search failed (' + res.status + '). Try again in a moment.';
      renderResults(); return;
    }
    const json = await res.json();
    if(seq !== searchSeq) return;
    ui.search.results = (json.foods || []).map(normalizeFood).filter(f => f.base.kcal != null);
    ui.search.status = 'done';
  }catch(e){
    if(seq !== searchSeq) return;
    ui.search.status = 'error';
    ui.search.error = navigator.onLine === false ? 'You’re offline. Use Quick add or a saved meal for now.' : 'Couldn’t reach the food database. Try again.';
  }
  renderResults();
}

function renderResults(){
  const box = document.getElementById('results');
  if(!box) return;
  const s = ui.search;
  if(s.status === 'loading'){ box.innerHTML = `<div class="msg">Searching…</div>`; return; }
  if(s.status === 'error'){ box.innerHTML = `<div class="msg">${esc(s.error)}</div>${manualRow()}`; return; }
  if(s.status === 'done' && !s.results.length){ box.innerHTML = `<div class="msg">No matches for “${esc(s.q)}”. Try fewer words, or the brand name.</div>${manualRow()}`; return; }
  if(s.status === 'idle'){

/* Swipe down to close: drags the whole sheet when it's scrolled to the top */
function closeSheet(){ ui.sheet = null; renderLayer(); }
function bindSheetDrag(){
  const sheet = document.querySelector('.sheet'), scrim = document.querySelector('.scrim');
  if(!sheet) return;
  let y0 = null, t0 = 0, dy = 0, dragging = false, onControl = false;
  sheet.addEventListener('touchstart', e => {
    y0 = null;
    if(e.touches.length !== 1) return;
    // Never treat touches on text boxes or dropdowns as a swipe, and don't swipe while the keyboard is up:
    // when the keyboard opens or closes the page shifts under your finger, which used to look like a drag
    // and cancelled the tap (that's why dropdowns sometimes wouldn't open).
    if(e.target.closest('input, select, textarea, label')) return;
    const f = document.activeElement;
    if(f && f !== document.body && f.matches('input, select, textarea')) return;
    y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; dragging = false;
    onControl = !!e.target.closest('button, a');
  }, {passive: true});
  sheet.addEventListener('touchmove', e => {
    if(y0 == null) return;
    const d = e.touches[0].clientY - y0;
    if(!dragging){
      // At the top and pulling down: stop iOS's own bounce from starting, so only the whole sheet moves.
      // On buttons, allow a few pixels of finger wobble so taps still register.
      if(d > (onControl ? 6 : 0) && sheet.scrollTop <= 0 && e.cancelable) e.preventDefault();
      if(d > 8 && sheet.scrollTop <= 0){ dragging = true; y0 = e.touches[0].clientY; sheet.style.transition = 'none'; if(document.activeElement) document.activeElement.blur(); }
      else if(d < -8 || sheet.scrollTop > 0){ y0 = null; }
      return;
    }
    e.preventDefault();
    dy = Math.max(0, d);
    sheet.style.transform = `translateY(${dy}px)`;
    scrim.style.background = `rgba(0,0,0,${(0.4 * Math.max(0, 1 - dy / 400)).toFixed(3)})`;
  }, {passive: false});
  const end = () => {
    if(!dragging){ y0 = null; return; }
    const v = dy / Math.max(1, Date.now() - t0);
    sheet.style.transition = 'transform .22s ease-out';
    if(dy > 120 || (dy > 40 && v > 0.6)){
      sheet.style.transform = 'translateY(100%)';
      scrim.style.background = 'rgba(0,0,0,0)';
      setTimeout(closeSheet, 200);
    } else {
      sheet.style.transform = '';
      scrim.style.background = '';
    }
    y0 = null; dragging = false;
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
}

      <button class="icon-btn plain" data-act="rm-item" data-id="${m.id}" data-j="${j}" aria-label="Remove ${esc(it.name)}">${I.x}</button></div>`).join('');
    return `<div class="saved open">${head}<div class="saved-body">
      <div class="mac"><div><span>Protein</span><b>${r0(t.protein)} g</b></div><div><span>Carbs</span><b>${r0(t.carbs)} g</b></div><div><span>Fat</span><b>${r0(t.fat)} g</b></div></div>

      <div class="grid2" style="margin:0"><button class="btn" data-act="rename-saved" data-id="${m.id}">Rename</button><button class="btn danger" data-act="del-saved" data-id="${m.id}">Delete</button></div>
    </div></div>`;
  }).join('');
  return `<div class="screen" role="dialog" aria-label="Saved meals">
    <div class="screen-hd"><div class="top"><div><button class="icon-btn plain" data-act="close" aria-label="Back">${I.left}</button><h1>Saved meals</h1></div>

    ${list || ''}
    <div class="empty-box"><b style="color:var(--ink)">Two ways to make one</b><br>Tap “+ New” to build a meal from scratch without logging it, or to save foods you already logged. You can also use “Add to a saved meal…” when adding any food.</div>
  </div>`;
}

function goalsPane(){

  return `<div class="sec-hd" style="margin-bottom:12px"><h2 style="font-size:18px">Daily goals</h2><span class="note">Saved automatically</span></div>
    <div class="form-grid">${f('kcal','Calories','kcal')}${f('protein','Protein','g')}${f('carbs','Carbs','g')}${f('fat','Fat','g')}${f('water','Water','cups')}${f('fiber','Fiber','g')}${f('sodium','Sodium','mg')}</div>
    <div class="note" id="macro-check" style="margin:10px 0 12px">${macroCheckText()}</div>
    <button class="btn dark" style="width:100%;margin-bottom:8px" data-act="open-calc">Calculate goals</button>`;
}
function bindPager(){
  const pg = document.getElementById('pager');
  if(!pg) return;
  pg.scrollLeft = ui.pane === 1 ? pg.clientWidth : 0;
  // The card takes the height of whichever side is showing (Today is shorter than Goals).
  const fit = i => { const pane = pg.children[i]; if(pane) pg.style.height = pane.offsetHeight + 'px'; };
  fit(ui.pane || 0);
  let t;
  pg.addEventListener('scroll', () => {
    const tallest = Math.max(pg.children[0].offsetHeight, pg.children[1].offsetHeight);
    if(pg.scrollLeft > 2 && pg.scrollLeft < pg.clientWidth - 2 && pg.offsetHeight < tallest) pg.style.height = tallest + 'px';
    clearTimeout(t);
    t = setTimeout(() => {
      const i = Math.round(pg.scrollLeft / pg.clientWidth);
      document.querySelectorAll('.pdots button').forEach((b, j) => b.setAttribute('aria-current', j === i));
      fit(i);
      if(i !== (ui.pane || 0)){
        ui.pane = i;
        // Goals changed while on the Goals side: refresh the summary once you swipe back.
        if(i === 0 && ui.goalsDirty){ ui.goalsDirty = false; renderMain(); }
      }
    }, 120);
  }, {passive: true});
}
function saveGoalInput(inp){
  const v = parseFloat(inp.value);
  if(!isNaN(v) && v >= 0){ data.goals[inp.dataset.goal] = v; save(); ui.goalsDirty = true; }
  else inp.value = data.goals[inp.dataset.goal];
}
function readGoals(){
  const rs = document.getElementById('restsec');
  if(rs){ const v = parseInt(rs.value, 10); if(v >= 5 && v <= 900) data.settings.rest = v; }
  const k = document.getElementById('apikey');
  if(k) data.settings.apiKey = k.value.trim();
  save();
}
function macroCheckText(){
  const val = k => { const i = document.querySelector(`[data-goal="${k}"]`); return parseFloat(i ? i.value : data.goals[k]) || 0; };
  const fromMacros = val('protein') * 4 + val('carbs') * 4 + val('fat') * 9;
  return `Your macro goals add up to about ${fmt(fromMacros)} kcal` + (Math.abs(fromMacros - val('kcal')) > 100 ? ` — ${fromMacros > val('kcal') ? 'more' : 'less'} than your calorie goal.` : '.');
}
function macroCheck(){ const el = document.getElementById('macro-check'); if(el) el.textContent = macroCheckText(); }
function calcSheet(){
  const c = data.settings.calc || {};
  return `<div class="grab"></div><div class="sec" style="gap:2px"><h2>Calculate goals</h2>
      <div class="note">An estimate from the Mifflin–St Jeor formula. It replaces your calorie and macro goals; you can still adjust them after.</div></div>
    <div class="form-grid">
      <label>Sex<select class="inp" id="c-sex"><option value="m" ${c.sex !== 'f' ? 'selected' : ''}>Male</option><option value="f" ${c.sex === 'f' ? 'selected' : ''}>Female</option></select></label>
      <label>Age<input class="inp" id="c-age" inputmode="numeric" value="${esc(c.age ?? '')}"></label>
      <label>Height (ft)<input class="inp" id="c-ft" inputmode="numeric" value="${esc(c.ft ?? '')}"></label>
      <label>Height (in)<input class="inp" id="c-in" inputmode="numeric" value="${esc(c.inch ?? '')}"></label>
      <label>Weight (lb)<input class="inp" id="c-lb" inputmode="decimal" value="${esc(c.lb ?? '')}"></label>
      <label>Activity<select class="inp" id="c-act">
        ${[['1.2','Mostly sitting'],['1.375','Light (1–3 workouts/wk)'],['1.55','Moderate (3–5/wk)'],['1.725','Very active (6–7/wk)']].map(([v, l]) => `<option value="${v}" ${String(c.act || '1.55') === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select></label>
    </div>
    <div class="sec" style="margin-top:12px"><div class="sublabel">Goal</div>
      <div class="seg" role="group" aria-label="Goal">${[['cut','Lose (−500)'],['keep','Maintain'],['bulk','Gain (+300)']].map(([v, l]) => `<button type="button" data-act="c-goal" data-v="${v}" aria-pressed="${(c.goal || 'keep') === v}">${l}</button>`).join('')}</div></div>
    <button class="btn primary" data-act="calc">Calculate & update goals</button>`;
}
function calculate(){
  const c = data.settings.calc = data.settings.calc || {};
  c.sex = document.getElementById('c-sex').value;
  c.age = parseFloat(document.getElementById('c-age').value);
  c.ft = parseFloat(document.getElementById('c-ft').value);
  c.inch = parseFloat(document.getElementById('c-in').value) || 0;
  c.lb = parseFloat(document.getElementById('c-lb').value);
  c.act = document.getElementById('c-act').value;
  if(!(c.age > 0 && c.ft > 0 && c.lb > 0)){ toast('Fill in age, height and weight'); return; }
  const kg = c.lb * 0.4536, cm = (c.ft * 12 + c.inch) * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * c.age + (c.sex === 'f' ? -161 : 5);
  let kcal = bmr * parseFloat(c.act);
  if(c.goal === 'cut') kcal -= 500; else if(c.goal === 'bulk') kcal += 300;
  kcal = Math.round(kcal / 10) * 10;
  const protein = Math.round(c.lb * 0.8);
  const fat = Math.round(kcal * 0.25 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  Object.assign(data.goals, {kcal, protein, fat, carbs});
  save(); ui.sheet = null; ui.pane = 1; ui.goalsDirty = false;
  renderAll();
  toast(`Goals updated: ${fmt(kcal)} kcal`);
}
async function exportData(){
  const json = JSON.stringify(data, null, 1);
  const name = 'fitness-backup-' + keyOf(new Date()) + '.json';
  try{
    const file = new File([json], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function importData(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d || typeof d !== 'object' || !d.days) throw 0;
      if(!confirm('Replace everything in the app with this backup?')) return;
      localStorage.setItem(STORE_KEY, JSON.stringify(d));
      data = loadData(); toast('Backup restored'); renderAll();
    }catch(e){ toast('That file isn’t a valid backup'); }
  };
  rd.readAsText(file);
}

function remember(food, si, qty){

      else items.push({name: e.name, brand: e.brand, per: e.per, qty: e.qty, servingLabel: e.servingLabel, servingUnit: e.servingUnit, servingUnitMode: e.servingUnitMode, servingText: servingText(e)});
    }
    const m = {id: uid(), name, items, uses:0};
    data.saved.unshift(m); save(); ui.sheet = null; ui.openSaved = m.id; toast('Saved meal created'); renderLayer();
  },
  settings(){ ui.screen = 'settings'; renderLayer(); },
  'open-calc'(){ ui.sheet = {type:'calc'}; renderLayer(); },
  pane(el){ const pg = document.getElementById('pager'); if(!pg) return; const i = +el.dataset.i;
    // Grow first when heading to the taller side, so the content isn't clipped mid-slide.
    if(i === 1) pg.style.height = Math.max(pg.offsetHeight, pg.children[1].offsetHeight) + 'px';
    pg.scrollTo({left: i * pg.clientWidth, behavior:'smooth'}); },
  'close-settings'(){ readGoals(); ui.screen = null; renderAll(); },
  'c-goal'(el){ data.settings.calc = data.settings.calc || {}; data.settings.calc.goal = el.dataset.v;
    document.querySelectorAll('[data-act="c-goal"]').forEach(b => b.setAttribute('aria-pressed', b === el)); save(); },
  calc(){ calculate(); },
  export(){ exportData(); }
};
Object.assign(actions, W_ACTIONS);
function stepSize(){ const s = ui.sheet; if(s.type === 'food' && s.food.servings[s.si].unitMode) return 10; if(s.type === 'entry' && s.entry.servingUnitMode) return 10; return s.qty < 1 ? 0.25 : 0.5; }
function stashQuick(){ const v = ui.sheet.vals = ui.sheet.vals || {}; ['qa-name','qa-kcal','qa-protein','qa-carbs','qa-fat'].forEach(id => { const el = document.getElementById(id); if(el) v[id] = el.value; }); }
function undoToast(msg, undo){
  toast(msg);
  const el = document.querySelector('.toast');
  const b = document.createElement('button');
  b.textContent = 'Undo'; b.style.cssText = 'margin-left:12px;background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;min-height:32px';
  b.onclick = () => { undo(); el.remove(); };
  el.appendChild(b);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 4500);
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  const fn = actions[el.dataset.act];
  if(fn){ if(el.tagName === 'BUTTON') ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('submit', ev => {
  if(ev.target.id === 'qform'){ ev.preventDefault(); const q = document.getElementById('q'); q.blur(); runSearch(q.value); }
});
let typeTimer;
document.addEventListener('input', ev => {
  if(wOnInput(ev)) return;
  if(ev.target.id === 'q'){
    clearTimeout(typeTimer);
    if(ui.search.status !== 'loading'){ ui.search.status = 'idle'; ui.search.results = []; }
    // Search runs when you press Search (saves the free API quota); clearing the box resets it.
    ui.search.q = ev.target.value;
    if(!ev.target.value.trim()) runSearch(''); else renderResults();
  }
  if(ev.target.dataset && ev.target.dataset.goal) macroCheck();
  if(ev.target.id === 'it-qty' || (ev.target.dataset && ev.target.dataset.nut)) itemTotalNote();
});
document.addEventListener('change', ev => {
  if(ev.target.dataset && ev.target.dataset.goal){ saveGoalInput(ev.target); macroCheck(); }
  if(ev.target.id === 'importfile' && ev.target.files[0]) importData(ev.target.files[0]);
});
document.addEventListener('visibilitychange', () => {
  // roll over to the new day if the app was left open overnight
  if(document.visibilityState === 'visible'){
    const t = keyOf(new Date());
    if(ui.lastToday && ui.lastToday !== t){
      if(ui.date === ui.lastToday || ui.date.slice(0,4) !== t.slice(0,4)) ui.date = t;
      if(ui.lastToday.slice(0,4) !== t.slice(0,4)){ pruneOldYears(); ui.calMonth = new Date().getMonth(); }
    }
    ui.lastToday = t;
    if(!ui.screen && !ui.sheet && !ui.wstack.length) renderMain();
  }
});

pruneOldYears();
ui.tab = data.active ? 'workouts' : (data.settings.tab || 'diet');
ui.lastToday = keyOf(new Date());
ui.calMonth = new Date().getMonth();
renderAll();
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
